name: tripthread
description: "TripThread - Travel Social Media Platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP Client
  dio: ^5.4.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^12.1.3

  # UI Components
  cupertino_icons: ^1.0.6

  # Form Validation
  form_field_validator: ^1.1.0

  # JSON Serialization
  json_annotation: ^4.9.0

  # Loading Indicators
  flutter_spinkit: ^5.2.0

  # Image Handling
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7
  video_player: ^2.9.1
  file_picker: ^8.0.0
  mime: ^1.0.5

  # Utils
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0

  # Maps & Location
  mapbox_maps_flutter: ^2.9.1
  geolocator: ^10.1.0
  geocoding: ^3.0.0

  # Connectivity
  connectivity_plus: ^6.1.4
  jwt_decoder: ^2.0.1

  # Deep Links
  app_links: ^3.4.5

  another_flushbar: ^1.12.30

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  json_serializable: ^6.11.1
  build_runner: ^2.7.2
  build_runner_core: ^9.3.2

flutter:
  uses-material-design: true

  assets:
    - .env
    # - assets/images/
    # - assets/icons/

