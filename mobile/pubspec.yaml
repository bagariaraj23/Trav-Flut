name: tripthread
description: "TripThread - Travel Social Media Platform"
publish_to: "none"

version: 1.0.0+5

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP Client
  dio: ^5.4.0

  # Secure Storage
  flutter_secure_storage: ^10.0.0

  # Local cache for user metadata (non-sensitive)
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^17.0.1

  # UI Components
  cupertino_icons: ^1.0.6

  # Form Validation
  form_field_validator: ^1.1.0

  # JSON Serialization
  json_annotation: ^4.9.0

  # Loading Indicators
  flutter_spinkit: ^5.2.0

  # Image Handling
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7
  video_player: ^2.9.1
  file_picker: ^10.3.8
  mime: ^2.0.0

  # Utils
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0

  # Maps & Location
  mapbox_maps_flutter: ^2.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Connectivity
  connectivity_plus: ^7.0.0
  jwt_decoder: ^2.0.1

  # Deep Links
  app_links: ^7.0.0

  # Sharing
  share_plus: ^10.1.3

  flutter_svg: ^2.0.17
  another_flushbar: ^1.12.30
  firebase_core: ^4.3.0
  google_sign_in: ^6.2.2
  http_parser: ^4.1.2 
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1
  build_runner: ^2.7.2
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    # - assets/icons/

