# TripThread — Complete Application Stack
# Starts PostgreSQL (dev and test), Next.js Backend API (REST + WebSocket /chat), and the Scheduler Service.
#
# Usage:
#   docker compose up --build -d                          # Start the full stack
#   docker compose --profile test run --rm api-tests      # Backend Vitest suite against postgres-test
#   docker compose --profile test run --rm mobile-tests   # flutter analyze + flutter test
#   docker compose down                                   # Stop and remove containers
#
# Compose reads `.env` in this directory for variable substitution, and the backend also
# loads it as an env_file when present (see docker.env.example).

name: tripthread

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: tripthread-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tripthread_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tripthread-network

  postgres-test:
    image: postgres:16-alpine
    container_name: tripthread-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tripthread_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tripthread-network

  backend:
    build: *backend-build
    image: tripthread-backend:local
    container_name: tripthread-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-dev:5432/${POSTGRES_DB:-tripthread_dev}?schema=public
      NODE_ENV: production
      TZ: UTC
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-for-local-development}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-jwt-refresh-secret-key-for-local-development}
      SHARE_LINK_BASE_URL: ${SHARE_LINK_BASE_URL:-http://localhost:3000}
      # migrate (default): prisma migrate deploy, baselining volumes created by the old db push entrypoint.
      # push: prisma db push (ALLOW_DATA_LOSS=1 adds --accept-data-loss). skip: no schema apply.
      DB_SCHEMA_MODE: ${DB_SCHEMA_MODE:-migrate}
      ALLOW_DATA_LOSS: ${ALLOW_DATA_LOSS:-0}
    depends_on:
      postgres-dev:
        condition: service_healthy
    # Image already ran build-server.mjs; match Railway Start (no esbuild at runtime)
    command: ["node", "server.cjs"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tripthread-network

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    image: tripthread-scheduler:local
    container_name: tripthread-scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-dev:5432/${POSTGRES_DB:-tripthread_dev}?schema=public
      NODE_ENV: production
      TZ: UTC
      # Trips start and end at minute-precision UTC instants; hourly runs could lag up to an hour.
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-300}
    depends_on:
      # The backend entrypoint applies migrations; the scheduler must not query an older schema.
      backend:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "while true; do node dist/index.js || echo 'Scheduler run failed'; echo \"Next run in $${SCHEDULER_INTERVAL_SECONDS}s\"; sleep \"$${SCHEDULER_INTERVAL_SECONDS}\"; done",
      ]
    networks:
      - tripthread-network

  api-tests:
    profiles: ["test"]
    build: *backend-build
    image: tripthread-backend:local
    container_name: tripthread-api-tests
    environment:
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/tripthread_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/tripthread_test?schema=public
      DB_SCHEMA_MODE: push
      ALLOW_DATA_LOSS: "1"
    depends_on:
      postgres-test:
        condition: service_healthy
    command:
      [
        "npx",
        "vitest",
        "run",
        "tests/unit",
        "tests/integration",
        "scheduler/tests",
        "src/app/test",
        "--reporter=dot",
        "--no-file-parallelism",
      ]
    networks:
      - tripthread-network

  mobile-tests:
    profiles: ["test"]
    image: ghcr.io/cirruslabs/flutter:${FLUTTER_IMAGE_TAG:-3.38.5}
    container_name: tripthread-mobile-tests
    working_dir: /app/mobile
    volumes:
      - ./mobile:/app/mobile
      - flutter_pub_cache:/root/.pub-cache
    # pubspec.yaml bundles mobile/.env (gitignored); tests only need the example values.
    # --enforce-lockfile keeps the bind-mounted pubspec.lock unchanged.
    command:
      [
        "bash",
        "-lc",
        "[ -f .env ] || cp .env.example .env; flutter pub get --enforce-lockfile && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test",
      ]

volumes:
  postgres_dev_data:
    driver: local
  postgres_test_data:
    driver: local
  flutter_pub_cache:
    driver: local

networks:
  tripthread-network:
    driver: bridge
