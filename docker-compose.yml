# TripThread — Complete Application Stack
# Starts PostgreSQL (dev and test), Next.js Backend API, and the Scheduler Service.
#
# Usage:
#   docker compose up --build -d   # Start the full stack
#   docker compose down            # Stop and remove containers
#
# Compose reads `.env` in this directory for optional custom overrides.

name: tripthread

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: tripthread-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tripthread_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tripthread-network

  postgres-test:
    image: postgres:16-alpine
    container_name: tripthread-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tripthread_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tripthread-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripthread-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-dev:5432/${POSTGRES_DB:-tripthread_dev}?schema=public
      - TEST_DATABASE_URL=postgresql://postgres:postgres@postgres-test:5432/tripthread_test?schema=public
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key-for-local-development}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-jwt-refresh-secret-key-for-local-development}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-true}
      - REDIS_REST_URL=${REDIS_REST_URL}
      - REDIS_REST_TOKEN=${REDIS_REST_TOKEN}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SHARE_LINK_BASE_URL=${SHARE_LINK_BASE_URL:-http://localhost:3000}
    depends_on:
      postgres-dev:
        condition: service_healthy
    command: ["npm", "run", "start"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tripthread-network

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: tripthread-scheduler
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-dev:5432/${POSTGRES_DB:-tripthread_dev}?schema=public
      - NODE_ENV=production
    depends_on:
      postgres-dev:
        condition: service_healthy
    # Runs the scheduler script periodically (every hour) in a shell loop
    command: ["sh", "-c", "while true; do node dist/index.js; echo 'Waiting 1 hour...'; sleep 3600; done"]
    networks:
      - tripthread-network

volumes:
  postgres_dev_data:
    driver: local
  postgres_test_data:
    driver: local

networks:
  tripthread-network:
    driver: bridge
