<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- TripThread App Icon – Rounded journey thread with connected nodes -->

  <!-- Background rounded square -->
  <rect width="48" height="48" rx="12" fill="url(#icon-bg)" />

  <!-- Thread path -->
  <path
    d="M12 34C16 28 18 18 24 18C30 18 28 30 36 26"
    stroke="white"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />
  <!-- Origin node -->
  <circle cx="12" cy="34" r="3" fill="white" />
  <!-- Mid node -->
  <circle cx="24" cy="18" r="2.5" fill="white" opacity="0.8" />
  <!-- Destination node + pin -->
  <circle cx="36" cy="26" r="3" fill="white" />
  <path d="M36 29L36 32" stroke="white" stroke-width="1.8" stroke-linecap="round" />
  <!-- Continuation dots -->
  <path
    d="M36 26C37.5 24.5 39 21 40 19"
    stroke="white"
    stroke-width="2"
    stroke-linecap="round"
    stroke-dasharray="1 3"
    opacity="0.35"
  />

  <defs>
    <linearGradient id="icon-bg" x1="0" y1="48" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7" />
      <stop offset="0.5" stop-color="#0D9488" />
      <stop offset="1" stop-color="#14B8A6" />
    </linearGradient>
  </defs>
</svg>
